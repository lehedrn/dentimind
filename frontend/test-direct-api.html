<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCC API 直接调用测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 CCC API 直接调用测试</h1>

    <div class="card">
        <h3>测试配置</h3>
        <p><strong>AccessKey ID:</strong> <span id="ak-id">your-access-key-id</span></p>
        <p><strong>Instance ID:</strong> demo-1767693362317534</p>
        <p><strong>Region:</strong> cn-shanghai</p>
        <p><strong>User ID:</strong> 智天气@demo-1767693362317534</p>
    </div>

    <div class="card">
        <h3>测试 1: 直接调用 GetLoginDetails API</h3>
        <button onclick="testGetLoginDetails()">调用 GetLoginDetails</button>
        <div id="result1"></div>
    </div>

    <div class="card">
        <h3>测试 2: 直接调用 ListDevices API</h3>
        <button onclick="testListDevices()">调用 ListDevices</button>
        <div id="result2"></div>
    </div>

    <div class="card">
        <h3>测试 3: 使用 SDK 初始化（直接模式）</h3>
        <button onclick="testSdkInit()">初始化 SDK</button>
        <div id="result3"></div>
    </div>

    <!-- 阿里云 CCC SDK -->
    <script src="https://g.alicdn.com/cloudcallcenter-voip/web-agentbar-sdk/2.4.0/index.js"></script>
    <script src="https://g.alicdn.com/cloudcallcenter/web-workbench-sdk/2.16.0/workbenchSdk.min.js"></script>

    <script>
        const CONFIG = {
            accessKeyId: 'your-access-key-id',
            accessKeySecret: 'your-access-key-secret',
            instanceId: 'demo-1767693362317534',
            regionId: 'cn-shanghai',
            userId: '智天气@demo-1767693362317534'
        };

        // 测试 1: 直接调用 GetLoginDetails
        async function testGetLoginDetails() {
            const resultDiv = document.getElementById('result1');
            resultDiv.innerHTML = '<p>调用中...</p>';

            try {
                // 使用阿里云 OpenAPI 签名
                const params = {
                    Action: 'GetLoginDetails',
                    InstanceId: CONFIG.instanceId,
                    UserId: CONFIG.userId,
                    Format: 'JSON',
                    Version: '2020-07-01',
                    AccessKeyId: CONFIG.accessKeyId,
                    SignatureMethod: 'HMAC-SHA1',
                    Timestamp: new Date().toISOString().replace(/\.\d{3}/, ''),
                    SignatureVersion: '1.0',
                    SignatureNonce: Math.random().toString(36).substring(2),
                    RegionId: CONFIG.regionId
                };

                // 构造签名字符串
                const sortedParams = Object.keys(params).sort();
                const canonicalizedQueryString = sortedParams
                    .map(key => `${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`)
                    .join('&');

                const stringToSign = `GET&${encodeURIComponent('/')}&${encodeURIComponent(canonicalizedQueryString)}`;

                // 计算签名（简化版，实际需要 HMAC-SHA1）
                // 这里只是测试，实际需要完整的签名逻辑
                const signature = 'PLACEHOLDER'; // 需要实际计算

                const url = `https://ccc.${CONFIG.regionId}.aliyuncs.com/?${canonicalizedQueryString}&Signature=${encodeURIComponent(signature)}`;

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                resultDiv.innerHTML = `<div class="card success"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="card error"><strong>错误:</strong> ${error.message}</div>`;
            }
        }

        // 测试 2: 直接调用 ListDevices
        async function testListDevices() {
            const resultDiv = document.getElementById('result2');
            resultDiv.innerHTML = '<p>调用中...</p>';

            try {
                // 类似上面的逻辑
                resultDiv.innerHTML = '<div class="card error"><strong>注意:</strong> 直接调用需要完整的签名逻辑，建议使用阿里云 SDK</div>';
            } catch (error) {
                resultDiv.innerHTML = `<div class="card error"><strong>错误:</strong> ${error.message}</div>`;
            }
        }

        // 测试 3: 使用 SDK 初始化（直接模式）
        function testSdkInit() {
            const resultDiv = document.getElementById('result3');
            resultDiv.innerHTML = '<p>初始化 SDK...</p>';

            try {
                // 尝试使用 SDK 直接模式（不使用 ajaxPath）
                const sdk = new WorkbenchSdk({
                    dom: 'result3',
                    regionId: CONFIG.regionId,
                    instanceId: CONFIG.instanceId,
                    // 不使用 ajaxPath，让 SDK 直接调用阿里云 API
                    // 需要配置 AccessKey
                    accessKeyId: CONFIG.accessKeyId,
                    accessKeySecret: CONFIG.accessKeySecret,

                    onInit() {
                        resultDiv.innerHTML += '<div class="card success">✅ SDK 初始化成功！</div>';
                    },
                    onErrorNotify(error) {
                        resultDiv.innerHTML += `<div class="card error"><strong>错误:</strong> ${JSON.stringify(error)}</div>`;
                    }
                });

                resultDiv.innerHTML += '<p>SDK 已创建，等待初始化...</p>';
            } catch (error) {
                resultDiv.innerHTML = `<div class="card error"><strong>错误:</strong> ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
